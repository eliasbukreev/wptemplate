services:
  wordpress:
    image: wordpress:7.0.2-php8.4-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wordpress-local-password}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_SITE_URL:-http://localhost:8080}');
        define('WP_SITEURL', '${WP_SITE_URL:-http://localhost:8080}');
    volumes:
      - wordpress_data:/var/www/html

  db:
    image: mysql:8.0.39
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME:-wordpress}
      MYSQL_USER: ${WP_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-wordpress-local-password}
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-mysql-local-root-password}
    ports:
      - "${WP_DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  wordpress_data:
  db_data:
